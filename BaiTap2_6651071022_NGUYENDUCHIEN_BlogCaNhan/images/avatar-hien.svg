<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#C7D2E3" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#2FB8C6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="460" rx="28" fill="#EEF2F8"/>
  <rect width="400" height="460" rx="28" fill="url(#grid)"/>

  <circle cx="200" cy="220" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6 8"/>

  <!-- head -->
  <path d="M200 90c48 0 78 36 78 84 0 26-8 48-22 64 34 14 60 44 66 80H78c6-36 32-66 66-80-14-16-22-38-22-64 0-48 30-84 78-84z"
        fill="none" stroke="#16233D" stroke-width="3.2"/>
  <!-- collar / shoulders -->
  <path d="M60 372c14-30 44-52 78-62M340 372c-14-30-44-52-78-62" fill="none" stroke="#16233D" stroke-width="3.2"/>

  <!-- facial construction lines (blueprint style) -->
  <line x1="200" y1="150" x2="200" y2="240" stroke="#2FB8C6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="150" y1="200" x2="250" y2="200" stroke="#2FB8C6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="172" cy="196" r="4.5" fill="#16233D"/>
  <circle cx="228" cy="196" r="4.5" fill="#16233D"/>
  <path d="M186 232q14 10 28 0" fill="none" stroke="#FF6B4A" stroke-width="3" stroke-linecap="round"/>

  <!-- glasses hint referencing tech/CS identity -->
  <rect x="150" y="182" width="40" height="26" rx="8" fill="none" stroke="#16233D" stroke-width="2"/>
  <rect x="210" y="182" width="40" height="26" rx="8" fill="none" stroke="#16233D" stroke-width="2"/>
  <line x1="190" y1="192" x2="210" y2="192" stroke="#16233D" stroke-width="2"/>

  <!-- annotation dots + measurement ticks -->
  <g stroke="#8496B3" stroke-width="1">
    <line x1="60" y1="90" x2="60" y2="380"/>
    <line x1="54" y1="90" x2="66" y2="90"/>
    <line x1="54" y1="380" x2="66" y2="380"/>
  </g>
  <text x="30" y="240" fill="#8496B3" font-family="monospace" font-size="11" transform="rotate(-90 30 240)">290px</text>
</svg>
